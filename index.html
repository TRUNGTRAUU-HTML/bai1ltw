<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý công việc cá nhân (Mini Task Manager)</h1>
        
        <!-- Form thêm công việc -->
        <form id="task-form">
            <div class="form-group">
                <label for="task-name">Tên công việc <span class="required">*</span></label>
                <input type="text" id="task-name" placeholder="Nhập tên công việc...">
                <small id="error-msg" class="error"></small>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="task-deadline">Hạn hoàn thành</label>
                    <input type="date" id="task-deadline">
                </div>
                
                <div class="form-group">
                    <label for="task-priority">Mức ưu tiên</label>
                    <select id="task-priority">
                        <option value="Cao">Cao</option>
                        <option value="Trung bình" selected>Trung bình</option>
                        <option value="Thấp">Thấp</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" id="add-btn">Thêm công việc</button>
        </form>

        <!-- Tìm kiếm và Lọc -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tìm kiếm theo tên công việc...">
            </div>
            <div class="filter-box">
                <select id="status-filter">
                    <option value="all">Tất cả</option>
                    <option value="pending">Chưa hoàn thành</option>
                    <option value="completed">Đã hoàn thành</option>
                </select>
            </div>
        </div>

        <!-- Danh sách công việc -->
        <div class="task-list-container">
            <ul id="task-list">
                <!-- Task items will be rendered here by JS -->
            </ul>
        </div>

        <!-- Footer -->
        <footer>
            <p>Họ tên: Nguyễn Đức Trung  &nbsp;|&nbsp; MSSV: 224001758</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
